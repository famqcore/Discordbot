version: 2
updates:
  - package-ecosystem: pip
    directory: /src/app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns:
          - discord.py
          - python-dotenv
      python-development:
        patterns:
          - coverage
          - pip-audit
          - pip-tools
          - ruff

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
